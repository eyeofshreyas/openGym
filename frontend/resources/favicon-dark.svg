<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 512 512">
  <!-- Browser-tab favicon for the app's dark theme. Same mark as icon.svg, but on the app's
       own dark backdrop instead of the grid-safe green tile — that tile is for the home-screen
       icon (see icon.svg), a browser tab isn't a grid of icons so it doesn't need that trick.
       Swapped in by App.jsx's applyPrefs() to track the in-app theme (not OS prefers-color-scheme,
       since the app's theme is user-chosen and can differ from the OS). -->
  <rect width="512" height="512" rx="112" fill="#0a0a0c"/>
  <g fill="#30d158">
    <rect x="170" y="234" width="172" height="44" rx="10"/>
    <rect x="126" y="164" width="52" height="184" rx="18"/>
    <rect x="334" y="164" width="52" height="184" rx="18"/>
    <rect x="72" y="200" width="40" height="112" rx="16"/>
    <rect x="400" y="200" width="40" height="112" rx="16"/>
  </g>
</svg>
